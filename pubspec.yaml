name: marpech
description: بازی مار با طراحی نئونی — برای اندروید، iOS، وب و ویندوز
publish_to: 'none'
version: 1.0.6+100

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  audioplayers: ^6.1.0
  http: ^1.6.0
  material_ui: ^1.11.0
  package_info_plus: ^10.2.2
  vibration: ^3.2.1
  lottie: ^3.8.2
  flutter_svg: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#0B0F14"
    theme_color: "#4CE0B3"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/lottie/    
    - assets/icons/    
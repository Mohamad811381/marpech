      - name: Generate app-version.json (anti-cache + semantic version)
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          TIMESTAMP=$(date +%s)
          echo "{\"version\":\"$TIMESTAMP\",\"semantic\":\"$VERSION\",\"build\":\"${{ github.run_number }}\",\"sha\":\"${{ github.sha }}\"}" > web/app-version.json
          cat web/app-version.json
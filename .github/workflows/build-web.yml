name: Build Web & Deploy to Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# ═══════════════════════════════════════════════════════════════════
#  تنظیمات آپدیت — این‌ها را دستی عوض کن
# ═══════════════════════════════════════════════════════════════════
env:
  # حداقل نسخه‌ی مجاز. اگر نسخه‌ی کاربر از این کمتر بود → آپدیت اجباری.
  # برای فعال کردن force، این را برابر نسخه‌ای بگذار که می‌خواهی از آن به بعد اجباری شود.
  # مثال: اگر MIN_VERSION=1.0.4 باشد، کاربران نسخه‌ی 1.0.3 و پایین‌تر اجبار می‌شوند.
  MIN_VERSION: "1.0.0"
# ═══════════════════════════════════════════════════════════════════

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Read version from pubspec
        id: ver
        run: |
          set -euo pipefail
          VERSION=$(sed -nE 's/^version:[[:space:]]*([^[:space:]]+).*/\1/p' pubspec.yaml | head -n1)
          if [ -z "$VERSION" ]; then
            echo "::error::Could not parse version from pubspec.yaml"
            exit 1
          fi
          if [[ "$VERSION" == *"+"* ]]; then
            SEMVER="${VERSION%%+*}"
            BUILD="${VERSION#*+}"
          else
            SEMVER="$VERSION"
            BUILD="0"
          fi
          echo "raw=$VERSION  semver=$SEMVER  build=$BUILD"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD"  >> "$GITHUB_OUTPUT"

      - name: Build Web (Release)
        run: |
          flutter build web \
            --release \
            --base-href /marpech/ \
            --dart-define=APP_VERSION=${{ steps.ver.outputs.semver }}

      - name: Generate app-version.json (after build)
        run: |
          set -euo pipefail
          LATEST="${{ steps.ver.outputs.semver }}"
          MIN="${{ env.MIN_VERSION }}"

          if [ -z "$LATEST" ]; then
            echo "::error::LATEST version is empty"
            exit 1
          fi
          if [ -z "$MIN" ]; then
            echo "::error::MIN_VERSION env is empty"
            exit 1
          fi

          cat > build/web/app-version.json <<EOF
          {"latest":"$LATEST","min_version":"$MIN"}
          EOF

          echo "=== app-version.json ==="
          cat build/web/app-version.json
          echo ""
          echo "=== sanity check ==="
          echo "latest=$LATEST  min=$MIN"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
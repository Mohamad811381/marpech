name: Auto Tag from pubspec

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: Auto Tag
        uses: jacopocarlini/action-autotag@stable
        with:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          tag_prefix: "v"
          overwrite: false   # 👈 این خط کلیدی است
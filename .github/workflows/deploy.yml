name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2  # ✅ به‌روزرسانی شد

      - name: Setup Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Generate app-version.json (anti-cache)
        run: |
          echo "{\"version\":\"$(date +%s)\",\"build\":\"${{ github.run_number }}\",\"sha\":\"${{ github.sha }}\"}" > web/app-version.json
          cat web/app-version.json

      - name: Build Web (Release)
        run: flutter build web --release --base-href /marpech/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5.0.0  # ✅ به‌روزرسانی شد
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5  # ✅ به‌روزرسانی شد